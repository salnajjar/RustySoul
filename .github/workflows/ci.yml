name: Verify
on:
  push:
    branches: [main, develop]
    paths-ignore:
      - 'site/**'
      - 'screens/**'
      - 'scripts/build-site.py'
      - '.github/workflows/pages.yml'
  pull_request:
    paths-ignore:
      - 'site/**'
      - 'screens/**'
      - 'scripts/build-site.py'
      - '.github/workflows/pages.yml'
  workflow_call:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  security:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/codeql.yml
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: 4
      RUST_TEST_THREADS: 4
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y clang pkg-config zlib1g-dev
      - run: rustup toolchain install 1.100 --profile minimal --component clippy --component rustfmt && rustup default 1.100
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            vendor/soulseek-rs-lib/target
          key: rust-${{ runner.os }}-1.100-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-1.100-
      - run: npm ci && npm run build && npm test
        working-directory: web
      - run: npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: web
      - run: cargo fmt --check && cargo clippy --locked --all-targets -- -D warnings && cargo test --locked --all-targets
      - run: cargo test --locked --all-targets --manifest-path vendor/soulseek-rs-lib/Cargo.toml
      - run: cargo build --release --locked && python3 scripts/smoke.py target/release/rustysoul && python3 scripts/env-smoke.py target/release/rustysoul
      - run: npm audit --omit=dev --audit-level=moderate
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: web/test-results/
          retention-days: 7
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: rustysoul:ci
          cache-from: type=gha,scope=rustysoul-amd64
          cache-to: type=gha,scope=rustysoul-amd64,mode=max
      - name: Installation matrix
        run: |
          python3 scripts/container-matrix.py --engine docker --image rustysoul:ci --network host --storage named
          python3 scripts/container-matrix.py --engine docker --image rustysoul:ci --network host --storage bind --bind-data
          python3 scripts/container-matrix.py --engine docker --image rustysoul:ci --network bridge --storage named
          python3 scripts/container-matrix.py --engine docker --image rustysoul:ci --network bridge --storage bind --bind-data
          python3 scripts/container-matrix.py --engine docker --image rustysoul:ci --network host --env-only
          python3 scripts/container-matrix.py --engine docker --image rustysoul:ci --network bridge --env-only
