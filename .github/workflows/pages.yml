name: Project website
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "screens/**"
      - "scripts/build-site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build public site
        run: python3 scripts/build-site.py --output "$RUNNER_TEMP/rustysoul-site"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/rustysoul-site
      - uses: actions/deploy-pages@v4
        id: deployment
