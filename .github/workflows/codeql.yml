name: Security analysis
on:
  workflow_call:
  schedule:
    - cron: '37 4 * * 1'
permissions:
  contents: read
jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, javascript-typescript, python, actions]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install locked review tools and test the review policy
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r .github/codeql/requirements.txt
          python -m unittest discover -s scripts/tests -p 'test_review_codeql.py'
      - uses: actions/setup-node@v4
        if: matrix.language == 'rust'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Prepare Rust semantic analysis and embedded web resources
        if: matrix.language == 'rust'
        run: |
          rustup toolchain install 1.100 --profile minimal --component rust-src
          rustup default 1.100
          sudo apt-get update && sudo apt-get install -y pkg-config zlib1g-dev
          npm ci --prefix web
          npm run build --prefix web
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
          upload: false
          output: artifacts/codeql/raw
      - name: Review only documented non-secret flows
        run: |
          mkdir -p artifacts/codeql/reviewed artifacts/codeql/reports
          found=0
          for file in artifacts/codeql/raw/*.sarif; do
            test -f "$file" || continue
            found=1
            name=$(basename "$file")
            python scripts/review-codeql.py --input "$file" --output "artifacts/codeql/reviewed/$name" --report "artifacts/codeql/reports/$name.json"
          done
          test "$found" = 1
      - uses: github/codeql-action/upload-sarif@v4
        if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/')
        with:
          sarif_file: artifacts/codeql/reviewed
          category: /language:${{ matrix.language }}
      - name: Block unreviewed Critical findings and failed scans
        run: |
          for file in artifacts/codeql/reviewed/*.sarif; do
            python scripts/review-codeql.py --input "$file" --gate-only --fail-on critical
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-${{ matrix.language }}-${{ github.run_attempt }}
          path: artifacts/codeql/
          retention-days: 7
