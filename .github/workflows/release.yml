name: Publish beta
on:
  push:
    tags: ['v*-beta.*']
permissions:
  contents: read
concurrency:
  group: beta-publish
  cancel-in-progress: false
jobs:
  verify:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os, re, tomllib
          tag = os.environ['RELEASE_TAG']
          assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+', tag), 'Invalid beta tag'
          version = tag[1:]
          assert tomllib.load(open('Cargo.toml', 'rb'))['package']['version'] == version
          assert json.load(open('web/package.json'))['version'] == version
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('version=' + version + '\n')
          PY
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          platforms: linux/amd64
          # Podman discards Docker's HEALTHCHECK extension from OCI manifests.
          # Docker media types preserve the health check in both runtimes.
          outputs: type=image,push=true,oci-mediatypes=false
          # In-image attestations require OCI media types. GitHub's immutable
          # release attestation still covers the tag and native release assets.
          provenance: false
          tags: |
            ghcr.io/salnajjar/rustysoul:${{ steps.version.outputs.version }}
            ghcr.io/salnajjar/rustysoul:beta
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=rustysoul-amd64
          cache-to: type=gha,scope=rustysoul-amd64,mode=max
      - name: Verify published image with Podman
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          sudo apt-get update && sudo apt-get install -y podman
          sudo podman pull "ghcr.io/salnajjar/rustysoul@$IMAGE_DIGEST"
          sudo python3 scripts/container-matrix.py --engine podman --image "ghcr.io/salnajjar/rustysoul@$IMAGE_DIGEST" --network host --storage named
          sudo python3 scripts/container-matrix.py --engine podman --image "ghcr.io/salnajjar/rustysoul@$IMAGE_DIGEST" --network host --storage named --env-only
      - name: Package native executable and release notes
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p artifacts
          docker pull "ghcr.io/salnajjar/rustysoul@$IMAGE_DIGEST"
          container=$(docker create "ghcr.io/salnajjar/rustysoul@$IMAGE_DIGEST")
          docker cp "$container:/usr/local/bin/rustysoul" artifacts/rustysoul
          docker rm "$container"
          chmod +x artifacts/rustysoul
          python3 scripts/smoke.py artifacts/rustysoul
          python3 scripts/package-native.py artifacts/rustysoul
          python3 - <<'PY'
          import os
          from pathlib import Path
          version = os.environ['VERSION']
          notes = Path('docs/RELEASE_NOTES.md').read_text()
          notes += '\nContainer: `ghcr.io/salnajjar/rustysoul:' + version + '` (Linux amd64).\n'
          notes += '\nImage digest: `' + os.environ['IMAGE_DIGEST'] + '`.\n'
          Path('artifacts/release-notes.md').write_text(notes)
          PY
      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --prerelease --title "RustySoul $RELEASE_TAG" --notes-file artifacts/release-notes.md artifacts/rustysoul-linux-x86_64.tar.gz artifacts/rustysoul-linux-x86_64.tar.gz.sha256
